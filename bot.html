<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta charset="UTF-8">
    <title>AgroBot Diagnóstico</title>
    <link rel="stylesheet" href="bot.css">
</head>
    <!-- BOTÃO FLUTUANTE GUIA RÁPIDO -->
<div id="btnGuiaRapido" onclick="abrirGuiaRapido()">!</div>

<!-- PAINEL GUIA RÁPIDO -->
<div id="painelGuia" class="painel-guia">
  <div class="painel-conteudo">
    <span class="fechar-guia" onclick="fecharGuiaRapido()">✖</span>
    <h2>🌿 Guia Rápido de Doenças</h2>
    <div id="listaGuiaDoencas"></div>
  </div>
</div>

<body>
    <div id="splash">
  <img src="logo.jpg" alt="Agro Inova" class="logo-splash">
  <p>AgroBot iniciando...</p>
</div>


<div class="container">
    <div class="header">
        <h1>🤖 AgroBot</h1>
        <p class="descricao-app">
            Olá! Este é o <b>AgroBot</b>, o assistente digital construído para ajudar o agricultor a identificar doenças na lavoura de forma rápida e simples.
        </p>
    </div>

    <div id="chat"></div>

    <div class="input-area">
        <input type="text" id="sintomas" disabled placeholder="Carregando base de dados...">
        <button id="btn-diagnosticar">Enviar</button>
    </div>
</div>
    <footer class="rodape">
  <img src="logo.jpg" alt="Agro Inova Logo" class="logo-rodape"> <p>Agro Inova © 2026</p> <span>Tecnologia em favor do campo 🌱</span>
</footer>


<script src="bot.js"></script>
</body>
</html>
