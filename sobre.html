<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="container">
    <h1>Agroinova - diagnóstico por imagem 📷🌱</h1>


    <label>Cultura:</label>

      <option value="" disabled selected>Selecione uma cultura</option>
      <option value="milho">Milho  🌽 </option>
      <option value="soja">Soja 🫛</option>
      <option value="feijao">Feijão 🫘</option>
    </select>

    <input type="file" id="foto" accept="image/*">

    <button onclick="analisar()">📷 Analisar imagem</button>
    <button onclick="reiniciar()" class="btn-reiniciar">🔄 Reiniciar</button>

    <div id="resultado" class="resultado"></div>
  </div>


<div id="floating-info-btn" onclick="toggleInfoMenu()">?</div>

        <button onclick="toggleInfoMenu()">✕</button>
    </div>
    <div class="info-body">
        <p><strong>📸 Imagem:</strong> Diagnóstico via foto disponível para 3 culturas.</p>
        <p><strong>💬 Texto:</strong> Centenas de outras culturas disponíveis via chat!</p>
        <hr style="border: 0; border-top: 1px solid #eee;">
        <a href="mailto:siteagroinova2gmail.com" class="contact-link">📧 Enviar E-mail</a>
        <a href="https://wa.me/5555996698757" target="_blank" class="contact-link"> 💬 WhatsApp</a>
    </div>
</div>
